server {
    listen 721 ssl;
    server_name anontokyo.tech;

    # 使用 Let's Encrypt 标准路径
    ssl_certificate /etc/letsencrypt/live/anontokyo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anontokyo.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
